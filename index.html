<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Little Words: Flashcards for Kobe &amp; Jayden</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#FFF7E6; color:#222; }
  header { text-align:center; padding:18px 12px 6px; }
  h1 { margin:0; font-size:28px; }
  .sub { color:#666; margin:6px 0 0; font-size:15px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:14px 12px; }
  .controls button, .controls select {
    font-size:16px; padding:12px 16px; border-radius:999px; border:2px solid #222;
    background:#fff; cursor:pointer; font-weight:700;
  }
  .controls button.active { background:#222; color:#fff; }
  main { max-width:560px; margin:0 auto; padding:0 16px 28px; }
  .card {
    border-radius:28px; padding:28px 16px 22px; text-align:center; cursor:pointer;
    border:3px solid rgba(0,0,0,.08); transition: transform .15s ease;
    min-height:320px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .card:active { transform: scale(.97); }
  .emoji { font-size:120px; line-height:1.1; }
  .en { font-size:42px; font-weight:800; }
  .zh { font-size:30px; font-weight:700; }
  .py { font-size:18px; color:#555; }
  .fr { font-size:20px; color:#555; font-style:italic; }
  .hint { text-align:center; color:#777; font-size:14px; margin-top:10px; }
  .nav { display:flex; gap:10px; justify-content:center; margin-top:16px; }
  .nav button { flex:1; max-width:170px; font-size:20px; padding:16px; border-radius:18px; border:none; background:#FFB703; font-weight:800; cursor:pointer; }
  .nav button.secondary { background:#8ECAE6; }
  .prompt { text-align:center; font-size:26px; font-weight:800; margin:8px 0 16px; min-height:36px; }
  .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .choice { border-radius:20px; border:3px solid rgba(0,0,0,.08); padding:16px 4px; text-align:center; cursor:pointer; background:#fff; }
  .choice .emoji { font-size:56px; }
  .choice .en { font-size:17px; }
  .choice.correct { outline:5px solid #2DC653; }
  .choice.wrong { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .stars { text-align:center; font-size:24px; min-height:32px; margin-top:12px; }
  .hidden { display:none; }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(.92)} 60%{transform:scale(1.04)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<header>
  <h1>Little Words 单词卡</h1>
  <p class="sub">Flashcards for Kobe &amp; Jayden. Tap the card to hear it.</p>
</header>

<div class="controls">
  <button id="modeLearn" class="active" type="button">Learn 学</button>
  <button id="modeFind" type="button">Find It! 找一找</button>
  <select id="lang" aria-label="Language">
    <option value="en-zh" selected>English + 中文</option>
    <option value="en">English only</option>
    <option value="zh">中文 only</option>
    <option value="fr">Français</option>
    <option value="en-fr">English + Français</option>
  </select>
</div>

<main>
  <section id="learnView">
    <div class="card" id="bigCard" role="button" aria-label="Hear this word">
      <div class="emoji" id="bigEmoji"></div>
      <div class="en" id="bigEn"></div>
      <div class="zh" id="bigZh"></div>
      <div class="py" id="bigPy"></div>
      <div class="fr" id="bigFr"></div>
    </div>
    <p class="hint">Tap the card to hear it again</p>
    <div class="nav">
      <button id="prevBtn" type="button" class="secondary">← Back</button>
      <button id="shuffleBtn" type="button">🔀 Shuffle</button>
      <button id="nextBtn" type="button">Next →</button>
    </div>
    <p class="hint" id="counter"></p>
  </section>

  <section id="findView" class="hidden">
    <p class="prompt" id="prompt"></p>
    <div class="choices" id="choices"></div>
    <div class="stars" id="stars"></div>
    <div class="nav"><button id="newRoundBtn" type="button">New word</button></div>
  </section>
</main>

<script>
const WORDS = [
  {en:"Apple", zh:"苹果", py:"píngguǒ", fr:"Pomme", emoji:"🍎", color:"#FFE5E5"},
  {en:"Banana", zh:"香蕉", py:"xiāngjiāo", fr:"Banane", emoji:"🍌", color:"#FFF3B0"},
  {en:"Dog", zh:"狗", py:"gǒu", fr:"Chien", emoji:"🐶", color:"#FFE8D6"},
  {en:"Cat", zh:"猫", py:"māo", fr:"Chat", emoji:"🐱", color:"#FDE2E4"},
  {en:"Bird", zh:"鸟", py:"niǎo", fr:"Oiseau", emoji:"🐦", color:"#DFF6FF"},
  {en:"Fish", zh:"鱼", py:"yú", fr:"Poisson", emoji:"🐟", color:"#CAF0F8"},
  {en:"Elephant", zh:"大象", py:"dàxiàng", fr:"Éléphant", emoji:"🐘", color:"#E2EAFc"},
  {en:"Lion", zh:"狮子", py:"shīzi", fr:"Lion", emoji:"🦁", color:"#FFEFC7"},
  {en:"Monkey", zh:"猴子", py:"hóuzi", fr:"Singe", emoji:"🐵", color:"#FFE8D6"},
  {en:"Frog", zh:"青蛙", py:"qīngwā", fr:"Grenouille", emoji:"🐸", color:"#D8F3DC"},
  {en:"Butterfly", zh:"蝴蝶", py:"húdié", fr:"Papillon", emoji:"🦋", color:"#F3E8FF"},
  {en:"Duck", zh:"鸭子", py:"yāzi", fr:"Canard", emoji:"🦆", color:"#FFF3B0"},
  {en:"Bear", zh:"熊", py:"xióng", fr:"Ours", emoji:"🐻", color:"#EDE0D4"},
  {en:"Rabbit", zh:"兔子", py:"tùzi", fr:"Lapin", emoji:"🐰", color:"#FDE2E4"},
  {en:"Car", zh:"车", py:"chē", fr:"Voiture", emoji:"🚗", color:"#DFF6FF"},
  {en:"Ball", zh:"球", py:"qiú", fr:"Balle", emoji:"⚽", color:"#E2EAFc"},
  {en:"Sun", zh:"太阳", py:"tàiyáng", fr:"Soleil", emoji:"☀️", color:"#FFF3B0"},
  {en:"Moon", zh:"月亮", py:"yuèliang", fr:"Lune", emoji:"🌙", color:"#E2EAFc"},
  {en:"Tree", zh:"树", py:"shù", fr:"Arbre", emoji:"🌳", color:"#D8F3DC"},
  {en:"Flower", zh:"花", py:"huā", fr:"Fleur", emoji:"🌸", color:"#FDE2E4"},
  {en:"Red", zh:"红色", py:"hóngsè", fr:"Rouge", emoji:"🔴", color:"#FFE5E5"},
  {en:"Blue", zh:"蓝色", py:"lánsè", fr:"Bleu", emoji:"🔵", color:"#DFF6FF"},
  {en:"Yellow", zh:"黄色", py:"huángsè", fr:"Jaune", emoji:"🟡", color:"#FFF9DB"},
  {en:"Green", zh:"绿色", py:"lǜsè", fr:"Vert", emoji:"🟢", color:"#D8F3DC"}
];

let idx = 0, score = 0, target = null;

function speak(text, lang) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.8;
  speechSynthesis.speak(u);
}
function speakWord(w) {
  speechSynthesis.cancel();
  const mode = document.getElementById('lang').value;
  if (mode === 'en') speak(w.en, 'en-US');
  else if (mode === 'zh') speak(w.zh, 'zh-CN');
  else if (mode === 'fr') speak(w.fr, 'fr-FR');
  else if (mode === 'en-fr') { speak(w.en, 'en-US'); speak(w.fr, 'fr-FR'); }
  else { speak(w.en, 'en-US'); speak(w.zh, 'zh-CN'); }
}

function renderLearn() {
  const w = WORDS[idx];
  const card = document.getElementById('bigCard');
  card.style.background = w.color;
  document.getElementById('bigEmoji').textContent = w.emoji;
  document.getElementById('bigEn').textContent = w.en;
  document.getElementById('bigZh').textContent = w.zh;
  document.getElementById('bigPy').textContent = w.py;
  document.getElementById('bigFr').textContent = w.fr;
  document.getElementById('counter').textContent = (idx + 1) + ' of ' + WORDS.length;
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
}

function newRound() {
  target = WORDS[Math.floor(Math.random() * WORDS.length)];
  const pool = WORDS.filter(w => w !== target).sort(() => Math.random() - 0.5).slice(0, 2);
  const choices = [target, ...pool].sort(() => Math.random() - 0.5);
  document.getElementById('prompt').textContent = 'Find the ' + target.en + '! 找' + target.zh + '!';
  speakWord(target);
  const wrap = document.getElementById('choices');
  wrap.innerHTML = '';
  choices.forEach(w => {
    const d = document.createElement('div');
    d.className = 'choice'; d.style.background = w.color;
    d.innerHTML = '<div class="emoji">' + w.emoji + '</div><div class="en">' + w.en + '</div>';
    d.onclick = () => {
      if (w === target) {
        d.classList.add('correct'); score++;
        document.getElementById('stars').textContent = '⭐'.repeat(Math.min(score, 10)) + ' Yay! 好棒!';
        speak('Yay!', 'en-US');
        setTimeout(newRound, 1400);
      } else {
        d.classList.add('wrong'); speakWord(w);
        setTimeout(() => d.classList.remove('wrong'), 350);
      }
    };
    wrap.appendChild(d);
  });
}

function setMode(find) {
  document.getElementById('learnView').classList.toggle('hidden', find);
  document.getElementById('findView').classList.toggle('hidden', !find);
  document.getElementById('modeLearn').classList.toggle('active', !find);
  document.getElementById('modeFind').classList.toggle('active', find);
  if (find) newRound();
}

document.getElementById('bigCard').onclick = () => speakWord(WORDS[idx]);
document.getElementById('nextBtn').onclick = () => { idx = (idx + 1) % WORDS.length; renderLearn(); speakWord(WORDS[idx]); };
document.getElementById('prevBtn').onclick = () => { idx = (idx - 1 + WORDS.length) % WORDS.length; renderLearn(); speakWord(WORDS[idx]); };
document.getElementById('shuffleBtn').onclick = () => { idx = Math.floor(Math.random() * WORDS.length); renderLearn(); speakWord(WORDS[idx]); };
document.getElementById('newRoundBtn').onclick = newRound;
document.getElementById('modeLearn').onclick = () => setMode(false);
document.getElementById('modeFind').onclick = () => setMode(true);
document.getElementById('lang').onchange = () => speakWord(WORDS[idx]);

renderLearn();
</script>
</body>
</html>
